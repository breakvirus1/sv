server {
    listen 0.0.0.0:5174;
    server_name ${SERVER_IP};

    resolver 127.0.0.11 valid=10s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets (hashed filenames) for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Cache HTML files for 1 hour (except index.html)
    location ~* \.html$ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # No cache for index.html to ensure fresh SPA
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /realms/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host keycloak:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host keycloak:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/cors-proxy/ {
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA route /admin (AdminPanel) — must NOT be redirected to Keycloak
    # (nginx would otherwise 301 /admin -> /admin/ and proxy it to KC console)
    location = /admin {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Keycloak Admin REST API (used by SPA for user/role management)
    location /admin/realms/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host keycloak:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Everything else under /admin/* → SPA (AdminPanel sub-paths)
    location /admin/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}
