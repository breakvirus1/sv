services:
  postgres:
    image: postgres:15-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sv-network

  # Сервис для инициализации tenant-баз данных при первом запуске
  init-tenant-db:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        psql -h postgres -U postgres -d svdb -c
        'CREATE TABLE IF NOT EXISTS svschema.tenant_databases (
          id BIGSERIAL PRIMARY KEY,
          company_id BIGINT NOT NULL UNIQUE,
          database_name VARCHAR(255) NOT NULL,
          created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
        );'
      "
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - sv-network
    profiles:
      - init

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-svdb}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      KC_HTTP_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      KC_HTTP_CORS_ALLOWED_HEADERS: "*"
      KC_HTTP_CORS_EXPOSED_HEADERS: "*"
      KC_HTTP_CORS_ALLOW_CREDENTIALS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${KEYCLOAK_REALM_IMPORT:-./keycloak/realm-export.json}:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
    networks:
      - sv-network

  discovery-server:
    build:
      context: .
      dockerfile: back/discovery-server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8761"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  order-service:
    build:
      context: .
      dockerfile: back/order-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - CALCULATOR_SERVICE_URL=http://calculator-service:8086
      - STATISTIC_SERVICE_URL=http://statistic-service:8089/api/v1/admin/statistics
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  client-service:
    build:
      context: .
      dockerfile: back/client-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  employee-service:
    build:
      context: .
      dockerfile: back/employee-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - KEYCLOAK_ADMIN_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-order-service}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  material-service:
    build:
      context: .
      dockerfile: back/material-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - KEYCLOAK_ADMIN_SERVER_URL=http://keycloak:8080
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}


  calculator-service:
    build:
      context: .
      dockerfile: back/calculator-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - MATERIAL_SERVICE_URL=http://material-service:8084/api/v1/materials
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  file-service:
    build:
      context: .
      dockerfile: back/file-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    volumes:
      - ./uploads:/app/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  comment-service:
    build:
      context: .
      dockerfile: back/comment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ./images:/app/images

  generate-data-service:
    build:
      context: .
      dockerfile: back/generate-data-service/Dockerfile
    # Запуск только для разработки/наполнения тестовыми данными:
    # docker compose --profile dev up -d generate-data-service
    profiles:
      - dev
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  statistic-service:
    build:
      context: .
      dockerfile: back/statistic-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  api-gateway:
    build:
      context: .
      dockerfile: back/api-gateway/Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
      client-service:
        condition: service_started
      employee-service:
        condition: service_started
      material-service:
        condition: service_started
      calculator-service:
        condition: service_started
      file-service:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv
      - KEYCLOAK_TOKEN_BASE_URL=http://keycloak:8080/realms/print-sv
      - KEYCLOAK_CLIENT_ID=frontend
      - SERVER_IP=${SERVER_IP:-127.0.0.1}
      - APP_TENANT_MASTER_URL=jdbc:postgresql://postgres:5432/svdb
      - APP_TENANT_USERNAME=${POSTGRES_USER:-postgres}
      - APP_TENANT_PASSWORD=${POSTGRES_PASSWORD}

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: production
      args:
        VITE_SERVER_IP: "${SERVER_IP:-127.0.0.1}"
        VITE_API_URL: ${VITE_API_URL:-/}
        VITE_KEYCLOAK_ISSUER: "${KEYCLOAK_PUBLIC_URL:-http://localhost:5174}/realms/print-sv"
        VITE_KEYCLOAK_CLIENT_ID: frontend
        SERVER_IP: "${SERVER_IP:-127.0.0.1}"
    ports:
      - "0.0.0.0:5174:5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5174/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - sv-network
    environment:
      - SERVER_IP=${SERVER_IP:-localhost}

networks:
  sv-network:
    name: sv-network
    driver: bridge
    external: false

volumes:
  postgres_data:
