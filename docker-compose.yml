services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: svdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "0.0.0.0:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sv-network

  keycloak:
     image: quay.io/keycloak/keycloak:26.1.4
     command: start-dev --import-realm
     ports:
       - "0.0.0.0:8080:8080"
     environment:
       KC_BOOTSTRAP_ADMIN_USERNAME: admin
       KC_BOOTSTRAP_ADMIN_PASSWORD: admin
       KC_DB: postgres
       KC_DB_URL: jdbc:postgresql://postgres:5432/svdb
       KC_DB_USERNAME: postgres
       KC_DB_PASSWORD: 12345
       KC_HOSTNAME: 192.168.88.40
       KC_HOSTNAME_STRICT: "false"
       KC_HTTP_ENABLED: "true"
     volumes:
       - /home/q/Документы/sv/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
     depends_on:
       postgres:
         condition: service_healthy
     networks:
       - sv-network

  discovery-server:
     build:
       context: .
       dockerfile: back/discovery-server/Dockerfile
     ports:
       - "0.0.0.0:8761:8761"
     depends_on:
       postgres:
         condition: service_healthy
     networks:
       - sv-network
     environment:
       - SPRING_PROFILES_ACTIVE=docker

  order-service:
    build:
      context: .
      dockerfile: back/order-service/Dockerfile
    ports:
      - "0.0.0.0:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv
      - STATISTIC_SERVICE_URL=http://statistic-service:8089/api/v1/admin/statistics

  client-service:
    build:
      context: .
      dockerfile: back/client-service/Dockerfile
    ports:
      - "0.0.0.0:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv

  employee-service:
    build:
      context: .
      dockerfile: back/employee-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv

  material-service:
    build:
      context: .
      dockerfile: back/material-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv


  calculator-service:
    build:
      context: .
      dockerfile: back/calculator-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv
      - MATERIAL_SERVICE_URL=http://material-service:8084/api/v1/materials

  file-service:
    build:
      context: .
      dockerfile: back/file-service/Dockerfile
    ports:
      - "0.0.0.0:8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    volumes:
      - ./uploads:/app/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/

  comment-service:
    build:
      context: .
      dockerfile: back/comment-service/Dockerfile
    ports:
      - "0.0.0.0:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv
    volumes:
      - ./uploads:/app/uploads
      - ./images:/app/images

  generate-data-service:
    build:
      context: .
      dockerfile: back/generate-data-service/Dockerfile
    ports:
      - "0.0.0.0:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv

  statistic-service:
    build:
      context: .
      dockerfile: back/statistic-service/Dockerfile
    ports:
      - "0.0.0.0:8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_HOST=postgres
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv

  api-gateway:
    build:
      context: .
      dockerfile: back/api-gateway/Dockerfile
    ports:
      - "0.0.0.0:8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
      order-service:
        condition: service_started
      client-service:
        condition: service_started
      employee-service:
        condition: service_started
      material-service:
        condition: service_started
      calculator-service:
        condition: service_started
      file-service:
        condition: service_started
    networks:
      - sv-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/print-sv

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: http://192.168.88.40:8085
        VITE_KEYCLOAK_ISSUER: http://192.168.88.40:8080/realms/print-sv
        VITE_KEYCLOAK_CLIENT_ID: frontend
    ports:
      - "0.0.0.0:5174:5174"
    depends_on:
      - api-gateway
    networks:
      - sv-network

networks:
  sv-network:
    name: sv-network
    driver: bridge
    external: false

volumes:
  postgres_data:
