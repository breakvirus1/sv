spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/svdb?reWriteBatchedInserts=true
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: svschema
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:5174/realms/print-sv}
          jwk-set-uri: http://keycloak:8080/realms/print-sv/protocol/openid-connect/certs
  flyway:
    enabled: true
    table: flyway_file_schema_history
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

app:
  tenant:
    enabled: true
    routing:
      enabled: true
    master-url: ${APP_TENANT_MASTER_URL:jdbc:postgresql://postgres:5432/svdb}
    username: ${APP_TENANT_USERNAME:postgres}
    password: ${APP_TENANT_PASSWORD}

file:
  storage:
    location: /app/uploads

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}

logging:
  level:
    com.example.fileservice: INFO
    org.springframework: INFO
    org.hibernate: INFO
