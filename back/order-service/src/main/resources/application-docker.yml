spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/svdb?reWriteBatchedInserts=true
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    table: flyway_order_schema_history
    baseline-on-migrate: true
    baseline-version: 20261022
    validate-on-migrate: true
    schemas: svschema
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: svschema
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:5174/realms/print-sv}
          jwk-set-uri: http://keycloak:8080/realms/print-sv/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}

calculator:
  service:
    url: ${CALCULATOR_SERVICE_URL:http://calculator-service:8086}

statistic:
  service:
    url: ${STATISTIC_SERVICE_URL:http://statistic-service:8089/api/v1/admin/statistics}

logging:
  level:
    com.example.orderservice: INFO
    org.springframework: INFO
    org.hibernate: INFO
