spring:
  datasource:
    url: ${APP_TENANT_MASTER_URL:jdbc:postgresql://postgres:5432/svdb}
    username: ${APP_TENANT_USERNAME:postgres}
    password: ${APP_TENANT_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    table: flyway_statistic_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    ignore-migration-patterns: "*:missing"

app:
  tenant:
    enabled: true
    routing:
      enabled: true
    master-url: ${APP_TENANT_MASTER_URL:jdbc:postgresql://postgres:5432/svdb}
    username: ${APP_TENANT_USERNAME:postgres}
    password: ${APP_TENANT_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}

logging:
  level:
    com.example.statisticservice: INFO
    org.springframework: INFO
    org.hibernate: INFO
