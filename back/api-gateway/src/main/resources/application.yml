server:
  port: 8085

app:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://192.168.1.40:8080/realms/print-sv}
    token-base-url: ${KEYCLOAK_TOKEN_BASE_URL:http://keycloak:8080/realms/print-sv}
    client-id: ${KEYCLOAK_CLIENT_ID:frontend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

spring:
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=0
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - StripPrefix=0
        - id: comment-replies
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comment-replies/**
          filters:
            - StripPrefix=0
        - id: images
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/images/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO
    com.example.apigateway: INFO
    org.springframework.cloud.gateway: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
