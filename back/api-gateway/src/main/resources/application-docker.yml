server:
  port: 8085

app:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:5174/realms/print-sv}
    token-base-url: ${KEYCLOAK_TOKEN_BASE_URL:http://keycloak:8080/realms/print-sv}
    client-id: ${KEYCLOAK_CLIENT_ID:frontend}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}

spring:
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:5174/realms/print-sv}
          jwk-set-uri: http://keycloak:8080/realms/print-sv/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: INFO
    com.example.apigateway: INFO
    org.springframework.cloud.gateway: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
